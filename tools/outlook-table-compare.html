<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlook 表格数据对比工具 (Smart Side-by-Side) 🦞</title>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --text-color: #333333;
            --panel-bg: #ffffff;
            --border-color: #ddd;
            --match-bg: #d4edda;
            --match-text: #155724;
            --diff-val-bg: #fff3cd;
            --diff-val-text: #856404;
            --only-a-bg: #f8d7da;
            --only-a-text: #721c24;
            --only-b-bg: #d1ecf1;
            --only-b-text: #0c5460;
            --header-bg: #f8f9fa;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 15px;
        }

        .home-btn {
            background: var(--panel-bg);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
            white-space: nowrap;
        }

        .home-btn:hover {
            background: #e3f2fd;
            border-color: #4a90e2;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .main-content {
            display: flex;
            gap: 20px;
            flex: 1;
            overflow: hidden;
        }

        .input-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-width: 0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: #555;
        }

        textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: none;
            outline: none;
            line-height: 1.4;
        }

        textarea:focus {
            border-color: #4a90e2;
            box-shadow: 0 0 0 2px rgba(74, 144, 226, 0.1);
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 0;
            border-top: 1px solid var(--border-color);
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        select, button, label {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: var(--panel-bg);
            cursor: pointer;
            font-size: 14px;
        }

        select {
            padding: 6px 10px;
        }

        button.primary {
            background: #4a90e2;
            color: white;
            border: none;
            font-weight: bold;
        }

        button.primary:hover {
            background: #357abd;
        }

        button.clear {
            background: #f5f5f5;
            color: #666;
        }

        button.clear:hover {
            background: #e0e0e0;
        }

        input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* 对比结果区域 */
        .result-panel {
            flex: 1.5;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0;
            overflow: hidden;
            display: none;
            flex-direction: column;
        }

        .result-panel.active {
            display: flex;
        }

        .result-header {
            padding: 10px 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            color: #555;
        }

        .stats {
            display: flex;
            gap: 15px;
            font-size: 13px;
        }

        .stat-match { color: #155724; }
        .stat-only-a { color: #721c24; }
        .stat-only-b { color: #0c5460; }
        .stat-diff { color: #856404; }

        .comparison-table-container {
            flex: 1;
            overflow: auto;
            position: relative;
        }

        table.comparison-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            table-layout: auto; /* 改为自适应 */
            min-width: 600px; /* 最小宽度，允许横向滚动 */
        }

        table.comparison-table th,
        table.comparison-table td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
            word-break: break-all;
            cursor: pointer;
            transition: background 0.2s;
            white-space: normal; /* 允许换行 */
        }

        table.comparison-table th {
            background: var(--header-bg);
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
            user-select: none;
            white-space: nowrap; /* 表头不换行 */
        }

        /* 列宽建议 */
        table.comparison-table th:nth-child(1) { min-width: 200px; } /* Key */
        table.comparison-table th:nth-child(2) { width: 40px; }  /* Arrow */
        table.comparison-table th:nth-child(3) { min-width: 200px; } /* Value A */
        table.comparison-table th:nth-child(4) { min-width: 200px; } /* Value B */

        /* 状态样式 */
        tr.row-match td { background: var(--match-bg); color: var(--match-text); }
        tr.row-only-a td:nth-child(3) { background: var(--only-a-bg); color: var(--only-a-text); font-weight: bold; }
        tr.row-only-a td:nth-child(4) { background: #f8f9fa; color: #999; }
        tr.row-only-b td:nth-child(3) { background: #f8f9fa; color: #999; }
        tr.row-only-b td:nth-child(4) { background: var(--only-b-bg); color: var(--only-b-text); font-weight: bold; }
        tr.row-diff td:nth-child(3) { background: var(--diff-val-bg); color: var(--diff-val-text); }
        tr.row-diff td:nth-child(4) { background: var(--diff-val-bg); color: var(--diff-val-text); }

        /* 箭头 */
        .arrow-cell {
            text-align: center;
            color: #999;
            font-weight: bold;
            user-select: none;
            width: 40px;
        }

        /* 复制提示 */
        .copy-tooltip {
            position: fixed;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .copy-tooltip.show {
            opacity: 1;
        }

        @media (max-width: 900px) {
            .main-content { flex-direction: column; }
            .result-panel { order: -1; max-height: 400px; }
            .controls { flex-direction: column; align-items: stretch; }
            .control-group { justify-content: space-between; }
        }
    
        /* 隐藏源数据功能 */
        body.hide-source .input-panel { display: none !important; } body.hide-source #hideSourceGroup { display: flex !important; visibility: visible !important; position: fixed; top: 10px; right: 10px; background: white; padding: 10px; border: 1px solid #ddd; z-index: 1000; }
        body.hide-source .result-panel { flex: 100% !important; width: 100% !important; }
        body.hide-source .comparison-table { font-size: 1.1em; }
        
        /* 长文本折叠样式 */
        .value-cell {
            max-width: 300px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .value-cell.expanded {
            max-width: none;
            overflow: visible;
            white-space: normal;
            word-break: break-all;
            min-height: 40px;
        }
        .value-cell.expanded::after {
            content: "▲";
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 10px;
            color: #999;
        }
        .value-cell:not(.expanded)::after {
            content: "▼";
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 10px;
            color: #999;
        }
        .value-cell:hover {
            background-color: rgba(0,0,0,0.05);
        }

    </style>
</head>
<body><div id="hideSourceGroup" style="display: none; position: fixed; top: 10px; right: 10px; background: white; padding: 10px; border: 1px solid #ddd; z-index: 9999;">
        <label>
            <input type="checkbox" id="hideSourceData">
            👁️ 隐藏源数据 (仅显示对比结果)
        </label>
    </div>
    
    <div class="header-nav">
        <a href="index.html" class="home-btn">← 返回工具集</a>
        <h1>📊 Outlook 表格数据对比 (Smart Side-by-Side)</h1>
    </div>

    <div class="main-content">
        <div class="input-panel">
            <div class="panel-header">
                <span>📄 数据 A (原始)</span>
                <button class="clear" onclick="clearCache('dataA')">🗑️ 清除 A</button>
            </div>
            <textarea id="dataA" placeholder="粘贴表格数据 A...&#10;例如：&#10;| 1 | KEY | Value |&#10;| 2 | KEY2 | Val2 |&#10;或者 (无序号)：&#10;| KEY | Value |"></textarea>
            
            <div class="panel-header">
                <span>📄 数据 B (目标)</span>
                <button class="clear" onclick="clearCache('dataB')">🗑️ 清除 B</button>
            </div>
            <textarea id="dataB" placeholder="粘贴表格数据 B..."></textarea>

            <div class="controls">
                <div class="control-group">
                    <label>分隔符:</label>
                    <select id="separator">
                        <option value="|">管道符 (|)</option>
                        <option value=",">逗号 (,)</option>
                        <option value="\t">制表符 (Tab)</option>
                        <option value=" ">空格</option>
                    </select>
                </div>
                <div class="control-group">
                    <input type="checkbox" id="hasNoColumn" checked>
                    <label for="hasNoColumn">第一列是序号 (No)</label>
                </div>
                <button class="primary" id="compareBtn">⚡ 开始对比</button>
            
            
                <button class="clear" onclick="resetAll()">🔄 重置所有</button>
            </div>
            <div style="font-size: 12px; color: #888; padding: 5px 0;">
                💡 提示：按 Key 排序，左右并排。🟢相同 🔴A独有 🔵B独有 🟠值不同。点击单元格复制。
            </div>
        </div>

        <div class="result-panel" id="resultPanel">
            <div class="result-header">
                <span>📊 对比结果 (按 Key 排序)</span>
                <div class="stats" id="stats"></div>
            </div>
            <div class="comparison-table-container">
                <table class="comparison-table" id="comparisonTable">
                    <thead>
                        <tr>
                            <th>Key</th>
                            <th>→</th>
                            <th>Value (A)</th>
                            <th>Value (B)</th>
                        </tr>
                    </thead>
                    
        <div class="action-buttons" style="margin: 10px 0; display: flex; gap: 10px; justify-content: center;">
            <button id="copyOnlyA" class="btn btn-warning" onclick="copyUniqueData('onlyA')">
                📋 复制 A独有 (Key=Value)
            </button>
            <button id="copyOnlyB" class="btn btn-info" onclick="copyUniqueData('onlyB')">
                📋 复制 B独有 (Key=Value)
            </button>
        </div>
        
        <tbody id="tableBody">
                        <!-- 动态生成 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="copy-tooltip" id="copyTooltip"></div>

    <script>
        const CACHE_KEY_A = 'outlook_compare_dataA';
        const CACHE_KEY_B = 'outlook_compare_dataB';
        const CACHE_HAS_NO = 'outlook_compare_hasNo';

        window.addEventListener('DOMContentLoaded', () => {
            const savedA = localStorage.getItem(CACHE_KEY_A);
            const savedB = localStorage.getItem(CACHE_KEY_B);
            const savedHasNo = localStorage.getItem(CACHE_HAS_NO);
            
            if (savedA) document.getElementById('dataA').value = savedA;
            if (savedB) document.getElementById('dataB').value = savedB;
            if (savedHasNo !== null) {
                document.getElementById('hasNoColumn').checked = savedHasNo === 'true';
            }
        });

        ['dataA', 'dataB'].forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                localStorage.setItem(id === 'dataA' ? CACHE_KEY_A : CACHE_KEY_B, e.target.value);
            });
        });

        document.getElementById('hasNoColumn').addEventListener('change', (e) => {
            localStorage.setItem(CACHE_HAS_NO, e.target.checked);
        });

        function clearCache(key) {
            const id = key === 'dataA' ? 'dataA' : 'dataB';
            document.getElementById(id).value = '';
            localStorage.removeItem(key === 'dataA' ? CACHE_KEY_A : CACHE_KEY_B);
            document.getElementById('resultPanel').classList.remove('active');
            document.getElementById('hideSourceData').checked = false;
            document.body.classList.remove('hide-source');
            document.getElementById('hideSourceGroup').style.display = 'none';
        }

        function resetAll() {
            { // 直接重置
                document.getElementById('dataA').value = '';
                document.getElementById('dataB').value = '';
                localStorage.removeItem(CACHE_KEY_A);
                localStorage.removeItem(CACHE_KEY_B);
                localStorage.removeItem(CACHE_HAS_NO);
                document.getElementById('resultPanel').classList.remove('active');
            document.getElementById('hideSourceData').checked = false;
            document.body.classList.remove('hide-source');
            document.getElementById('hideSourceGroup').style.display = 'none';
            }
        }

        function parseData(text, separator, hasNoColumn) {
            if (!text.trim()) return [];
            const lines = text.trim().split('\n');
            const result = [];
            
            lines.forEach(line => {
                if (!line.trim()) return;
                let parts;
                if (separator === '\\t') {
                    parts = line.split('\t');
                } else {
                    parts = line.split(separator);
                }
                
                const values = parts.map(v => v.trim()).filter(v => v !== '' || v === ' ');
                if (values.length < 2) return;

                let key, value;
                if (hasNoColumn) {
                    // 假设：No(0), Key(1), Value(2)
                    if (values.length >= 3) {
                        key = values[1];
                        value = values[2];
                    } else {
                        // 如果只有两列，但用户勾选了有 No，则第一列是 No，第二列是 Key，Value 为空
                        key = values[0];
                        value = '';
                    }
                } else {
                    // 假设：Key(0), Value(1)
                    key = values[0];
                    value = values[1] || '';
                }

                result.push({
                    original: line,
                    key: key,
                    value: value
                });
            });
            return result;
        }

        function compareSets(dataA, dataB) {
            const mapA = new Map();
            const mapB = new Map();

            dataA.forEach(row => mapA.set(row.key, row));
            dataB.forEach(row => mapB.set(row.key, row));

            const allKeys = new Set([...mapA.keys(), ...mapB.keys()]);
 const sortedKeys = Array.from(allKeys).sort((a, b) => {
 const rowA_a = mapA.get(a);
 const rowA_b = mapB.get(a);
 const rowB_a = mapA.get(b);
 const rowB_b = mapB.get(b);

 const getType = (rowA, rowB) => {
 if (rowA && rowB) {
 return rowA.value === rowB.value ? 'match' : 'diff';
 } else if (rowA) {
 return 'only-a';
 } else {
 return 'only-b';
 }
 };

 const typeA = getType(rowA_a, rowA_b);
 const typeB = getType(rowB_a, rowB_b);
 const priority = { 'diff': 1, 'only-a': 2, 'only-b': 3, 'match': 4 };

 if (priority[typeA] !== priority[typeB]) {
 return priority[typeA] - priority[typeB];
 }
 return a.localeCompare(b);
 });

            const rows = [];
            let matchCount = 0, onlyA = 0, onlyB = 0, diffCount = 0;

            sortedKeys.forEach(key => {
                const rowA = mapA.get(key);
                const rowB = mapB.get(key);

                let type = '';
                if (rowA && rowB) {
                    if (rowA.value === rowB.value) {
                        type = 'match';
                        matchCount++;
                    } else {
                        type = 'diff';
                        diffCount++;
                    }
                } else if (rowA) {
                    type = 'only-a';
                    onlyA++;
                } else {
                    type = 'only-b';
                    onlyB++;
                }

                rows.push({
                    key,
                    rowA,
                    rowB,
                    type,
                    valA: rowA ? rowA.value : '',
                    valB: rowB ? rowB.value : ''
                });
            });

            return { rows, stats: { match: matchCount, onlyA, onlyB, diff: diffCount } };
        }

        function copyToClipboard(text, event) {
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                const tooltip = document.getElementById('copyTooltip');
                tooltip.textContent = `✅ 已复制：${text}`;
                tooltip.classList.add('show');
                
                const cell = event.target;
                const originalBg = cell.style.backgroundColor;
                cell.style.backgroundColor = '#d4edda';
                setTimeout(() => {
                    cell.style.backgroundColor = originalBg;
                    tooltip.classList.remove('show');
                }, 300);
            }).catch(err => {
                alert('❌ 复制失败，请手动复制');
            });
        }

        function renderComparison(result) {
        window.result = result; // 保存全局引用
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            result.rows.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = `row-${row.type}`;

                // Key
                const tdKey = document.createElement('td');
                tdKey.textContent = row.key;
                tdKey.onclick = (e) => copyToClipboard(row.key, e);
                tr.appendChild(tdKey);

                // Arrow
                const tdArrow = document.createElement('td');
                tdArrow.className = 'arrow-cell';
                tdArrow.textContent = '→';
                tdArrow.style.color = row.type === 'match' ? '#28a745' : (row.type === 'diff' ? '#fd7e14' : '#999');
                tr.appendChild(tdArrow);

                // Value (A)
                const tdValA = document.createElement('td');
                tdValA.className = 'value-cell'; const valA = row.valA || ''; tdValA.textContent = valA.length > 60 ? valA.substring(0, 60) + '...' : valA; tdValA.onclick = (e) => { e.stopPropagation(); toggleValue(tdValA, valA); };
                tdValA.onclick = (e) => copyToClipboard(row.valA, e);
                tr.appendChild(tdValA);

                // Value (B)
                const tdValB = document.createElement('td');
                tdValB.className = 'value-cell'; const valB = row.valB || ''; tdValB.textContent = valB.length > 60 ? valB.substring(0, 60) + '...' : valB; tdValB.onclick = (e) => { e.stopPropagation(); toggleValue(tdValB, valB); };
                tdValB.onclick = (e) => copyToClipboard(row.valB, e);
                tr.appendChild(tdValB);

                tbody.appendChild(tr);
            });

            // 更新统计
            const stats = document.getElementById('stats');
            stats.innerHTML = `
                <span class="stat-match">🟢 相同：${result.stats.match}</span>
                <span class="stat-only-a">🔴 A独有：${result.stats.onlyA}</span>
                <span class="stat-only-b">🔵 B独有：${result.stats.onlyB}</span>
                <span class="stat-diff">🟠 不同：${result.stats.diff}</span>
            `;
        }

        document.getElementById('compareBtn').addEventListener('click', () => {
            const separator = document.getElementById('separator').value;
            const hasNoColumn = document.getElementById('hasNoColumn').checked;
            
            const dataA = parseData(document.getElementById('dataA').value, separator, hasNoColumn);
            const dataB = parseData(document.getElementById('dataB').value, separator, hasNoColumn);

            if (dataA.length === 0 && dataB.length === 0) {
                alert('请输入数据！');
                return;
            }

            const result = compareSets(dataA, dataB);
            renderComparison(result);
            document.getElementById('resultPanel').classList.add('active');
            document.getElementById('hideSourceGroup').style.display = 'flex';
        });
    
        // 折叠/展开长文本
        function toggleValue(cell, fullText) {
            cell.classList.toggle('expanded');
            if (cell.classList.contains('expanded')) {
                cell.textContent = fullText;
                navigator.clipboard.writeText(fullText).then(() => {
                    console.log('已复制完整内容');
                }).catch(err => {
                    console.log('复制失败:', err);
                });
            } else {
                const maxLen = 60;
                cell.textContent = fullText.substring(0, maxLen) + (fullText.length > maxLen ? '...' : '');
            }
        }

    
        const checkbox = document.getElementById('hideSourceData');
        if (checkbox) {
            checkbox.addEventListener('change', (e) => {
                const group = document.getElementById('hideSourceGroup');
                if (e.target.checked) {
                    document.body.classList.add('hide-source');
                    group.style.display = 'flex';
                    group.style.position = 'fixed';
                    group.style.top = '10px';
                    group.style.right = '10px';
                    group.style.zIndex = '9999';
                } else {
                    document.body.classList.remove('hide-source');
                    group.style.display = 'none';
                }
            });
        }
    
    
        // 复制 A独有或B独有数据
        function copyUniqueData(type) {
            if (!window.result || !window.result.rows) {
                alert('请先进行对比！');
                return;
            }
            const typeMap = { 'onlyA': 'only-a', 'onlyB': 'only-b' };
            const targetType = typeMap[type];
            const data = window.result.rows.filter(row => row.type === targetType);
            if (data.length === 0) {
                alert(type === 'onlyA' ? '没有 A 独有的数据！' : '没有 B 独有的数据！');
                return;
            }
            
            const text = data.map(row => {
                const val = type === 'onlyA' ? row.valA : row.valB;
                return `${row.key}=${val}`;
            }).join('\n');
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById(type === 'onlyA' ? 'copyOnlyA' : 'copyOnlyB');
                const originalText = btn.textContent;
                btn.textContent = '✅ 已复制！';
                btn.style.backgroundColor = '#28a745';
                btn.style.color = 'white';
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.backgroundColor = '';
                    btn.style.color = '';
                }, 2000);
            }).catch(err => {
                console.error('复制失败:', err);
                alert('复制失败，请手动复制。');
            });
        }

    </script>
</body>
</html>
