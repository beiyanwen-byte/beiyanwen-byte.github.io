<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OC Chat - opencode 本地会话</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f5f7fa; color:#333; height:100vh; overflow:hidden; display:flex; flex-direction:column; }
  .header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:#fff; border-bottom:1px solid #e1e5eb; }
  .header .home-btn { background:#f8f9fb; color:#333; padding:5px 12px; border-radius:4px; border:1px solid #ddd; font-size:12px; text-decoration:none; white-space:nowrap; }
  .header .home-btn:hover { border-color:#0066cc; }
  .header .title { font-size:15px; font-weight:600; color:#0066cc; flex:1; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#dc3545; margin-right:4px; vertical-align:1px; }
  .dot.ok { background:#28a745; }
  .container { display:flex; flex:1; overflow:hidden; }
  .side { width:230px; background:#fff; border-right:1px solid #e1e5eb; display:flex; flex-direction:column; }
  .side-head { padding:10px 12px; border-bottom:1px solid #e1e5eb; }
  .side-head button { width:100%; padding:7px 10px; background:#0066cc; color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:13px; }
  .side-head button:hover { background:#0052a3; }
  .sess-list { flex:1; overflow:auto; }
  .sess-item { padding:9px 12px; cursor:pointer; border-bottom:1px solid #f2f4f7; font-size:12.5px; }
  .sess-item:hover { background:#f0f7ff; }
  .sess-item.active { background:#e8f0fe; border-left:3px solid #0066cc; }
  .sess-item .st { color:#555; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sess-item .sm { color:#999; font-size:11px; margin-top:2px; }
  .main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .ctx-bar { padding:8px 14px; background:#fff8e6; border-bottom:1px solid #f0e0b0; font-size:12px; display:none; align-items:center; gap:8px; }
  .ctx-bar .ctx-text { flex:1; color:#7a5c00; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ctx-bar button { padding:4px 10px; border:1px solid #e0c860; background:#fff; border-radius:4px; cursor:pointer; font-size:12px; }
  .ctx-bar button:hover { background:#fff3cd; }
  .msgs { flex:1; overflow:auto; padding:16px; }
  .msg { max-width:82%; margin-bottom:12px; padding:9px 13px; border-radius:8px; font-size:13.5px; line-height:1.55; word-break:break-word; white-space:pre-wrap; }
  .msg.user { background:#0066cc; color:#fff; margin-left:auto; }
  .msg.assistant { background:#fff; border:1px solid #e1e5eb; }
  .msg.assistant .model { color:#999; font-size:11px; margin-top:6px; }
  .msg.sys { background:transparent; color:#999; font-size:11.5px; text-align:center; max-width:100%; padding:2px; }
  .composer { display:flex; gap:8px; padding:12px 14px; background:#fff; border-top:1px solid #e1e5eb; }
  .composer textarea { flex:1; resize:none; border:1px solid #ddd; border-radius:6px; padding:9px 11px; font-size:13.5px; font-family:inherit; line-height:1.45; max-height:140px; }
  .composer textarea:focus { outline:none; border-color:#0066cc; }
  .composer button { padding:0 20px; background:#0066cc; color:#fff; border:none; border-radius:6px; cursor:pointer; font-size:14px; }
  .composer button:hover { background:#0052a3; }
  .composer button:disabled { background:#9dc3e6; cursor:not-allowed; }
  /* 配对面板 */
  .pair-overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; z-index:99; }
  .pair-box { background:#fff; border-radius:10px; padding:24px 26px; width:480px; max-width:92vw; box-shadow:0 10px 30px rgba(0,0,0,.2); }
  .pair-box h3 { font-size:16px; margin-bottom:10px; }
  .pair-box ol { margin:0 0 12px 20px; color:#555; font-size:13px; line-height:1.8; }
  .pair-box code { background:#f4f6f8; padding:1px 5px; border-radius:3px; font-size:12px; }
  .pair-box input { width:100%; padding:8px 10px; border:1px solid #ddd; border-radius:5px; font-size:13px; margin-bottom:10px; }
  .pair-box .btns { display:flex; gap:8px; justify-content:flex-end; }
  .pair-box button { padding:7px 16px; border-radius:5px; border:1px solid #ddd; background:#fff; cursor:pointer; font-size:13px; }
  .pair-box button.primary { background:#0066cc; color:#fff; border-color:#0066cc; }
  .pair-box .err { color:#dc3545; font-size:12px; margin-bottom:8px; display:none; }
  .msg-area { position:fixed; top:14px; right:14px; z-index:200; }
  .toast { padding:10px 16px; border-radius:6px; margin-bottom:8px; font-size:13px; box-shadow:0 4px 12px rgba(0,0,0,.15); animation:slideIn .25s; }
  .toast.success { background:#d4edda; color:#155724; }
  .toast.error { background:#f8d7da; color:#721c24; }
  .toast.info { background:#d1ecf1; color:#0c5460; }
  @keyframes slideIn { from { transform:translateX(40%); opacity:0; } to { transform:none; opacity:1; } }
  .empty { color:#999; text-align:center; margin-top:70px; font-size:13.5px; line-height:2; }
</style>
</head>
<body>
<div class="header">
  <a class="home-btn" href="index.html">← 工具中心</a>
  <span class="title">🤖 OC Chat <span id="connState" style="font-size:12px;font-weight:400;color:#888"><span class="dot" id="connDot"></span><span id="connText">检查中…</span></span></span>
  <button id="repairBtn" style="padding:5px 12px;border:1px solid #ddd;background:#fff;border-radius:4px;cursor:pointer;font-size:12px" onclick="showPair(true)">重新配对</button>
</div>

<div class="container">
  <div class="side">
    <div class="side-head"><button onclick="newSession()">＋ 新会话</button></div>
    <div class="sess-list" id="sessList"><div class="empty" style="margin-top:20px;font-size:12px">加载中…</div></div>
  </div>
  <div class="main">
    <div class="ctx-bar" id="ctxBar">
      <span class="ctx-text" id="ctxText"></span>
      <button onclick="insertCtx()">📋 插入到输入框</button>
    </div>
    <div class="msgs" id="msgs"><div class="empty">📋 选择左侧会话，或点「新会话」开始<br>可配合工具页的「🤖 AI 分析」按钮带上下文打开</div></div>
    <div class="composer">
      <textarea id="input" rows="2" placeholder="输入消息，Enter 发送 / Shift+Enter 换行"></textarea>
      <button id="sendBtn" onclick="send()">发送</button>
    </div>
  </div>
</div>

<div class="pair-overlay" id="pairOverlay" style="display:none">
  <div class="pair-box">
    <h3>🔗 配对本地 opencode 服务</h3>
    <ol>
      <li>在 WSL 终端运行：<code>opencode pair</code></li>
      <li>复制输出的链接（5 分钟内有效、一次性）</li>
      <li>粘贴到下面并连接 —— 凭证只存本浏览器 localStorage</li>
    </ol>
    <div class="err" id="pairErr"></div>
    <input id="pairInput" placeholder="http://127.0.0.1:49374/auth/connect/xxxx">
    <div class="btns">
      <button onclick="showPair(false)" id="pairCancelBtn">取消</button>
      <button class="primary" onclick="doPair()">连接</button>
    </div>
  </div>
</div>

<div class="msg-area" id="msgArea"></div>

<script>
const API = 'http://127.0.0.1:49374';
const LS_TOKEN = 'oc-chat-token';
const LS_SESSION = 'oc-chat-session';

let token = localStorage.getItem(LS_TOKEN);
let currentSession = localStorage.getItem(LS_SESSION);
let waiting = false;      // 是否正在等 AI 回复
let pollTimer = null;
let sseAbort = null;

// URL 参数（工具上下文）
const urlTool = new URLSearchParams(location.search).get('tool') || '';
const urlCtx = new URLSearchParams(location.search).get('ctx') || '';

// ---------- 基础 ----------
function authHeaders() { return { 'Authorization': 'Basic ' + btoa('opencode:' + token) }; }

async function api(path, opts = {}) {
  const r = await fetch(API + path, {
    method: opts.method || 'GET',
    headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders(), opts.headers || {}),
    body: opts.body ? JSON.stringify(opts.body) : undefined
  });
  if (r.status === 401) { setConn(false, '凭证失效'); showPair(true, '凭证失效或过期，请重新配对'); throw new Error('401'); }
  if (!r.ok) throw new Error(r.status + ' ' + (await r.text()).slice(0, 80));
  return r.json();
}

function setConn(ok, text) {
  document.getElementById('connDot').className = 'dot' + (ok ? ' ok' : '');
  document.getElementById('connText').textContent = text || (ok ? '已连接' : '未连接');
}

function toast(text, type) {
  const t = document.createElement('div');
  t.className = 'toast ' + (type || 'info');
  t.textContent = text;
  document.getElementById('msgArea').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function fmtTime(ms) {
  const d = new Date(ms);
  return d.toLocaleDateString() === new Date().toLocaleDateString()
    ? d.toTimeString().slice(0, 5)
    : (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.toTimeString().slice(0, 5);
}

// ---------- 配对 ----------
function showPair(show, err) {
  document.getElementById('pairOverlay').style.display = show ? 'flex' : 'none';
  document.getElementById('pairErr').style.display = err ? 'block' : 'none';
  if (err) document.getElementById('pairErr').textContent = err;
  if (show) { document.getElementById('pairCancelBtn').style.display = token ? 'inline-block' : 'none'; document.getElementById('pairInput').focus(); }
}

async function doPair() {
  const link = document.getElementById('pairInput').value.trim();
  const m = link.match(/\/auth\/connect\/([A-Za-z0-9_-]+)/);
  if (!m) { document.getElementById('pairErr').textContent = '链接格式不对，应包含 /auth/connect/xxx'; document.getElementById('pairErr').style.display = 'block'; return; }
  try {
    const r = await fetch(API + '/auth/connect/' + m[1], { headers: authHeaders0() });
    if (!r.ok) throw new Error((await r.json()).message || r.status);
    const j = await r.json();
    token = j.token;
    localStorage.setItem(LS_TOKEN, token);
    showPair(false);
    setConn(true);
    toast('✅ 配对成功', 'success');
    init();
  } catch (e) {
    document.getElementById('pairErr').textContent = '配对失败: ' + e.message + '（链接是否过期？重新运行 opencode pair）';
    document.getElementById('pairErr').style.display = 'block';
  }
}
// 配对请求不带认证头（链接本身就是凭证）
function authHeaders0() { return {}; }

// ---------- 会话列表 ----------
async function loadSessions() {
  const j = await api('/api/session?limit=50');
  const arr = Array.isArray(j) ? j : (j.data || []);
  const list = document.getElementById('sessList');
  list.innerHTML = '';
  arr.forEach(s => {
    const div = document.createElement('div');
    div.className = 'sess-item' + (s.id === currentSession ? ' active' : '');
    const st = document.createElement('div'); st.className = 'st'; st.textContent = s.title || ('会话 ' + s.id.slice(4, 14));
    const sm = document.createElement('div'); sm.className = 'sm'; sm.textContent = fmtTime(s.time && s.time.updated || s.time && s.time.created || Date.now());
    div.appendChild(st); div.appendChild(sm);
    div.onclick = () => openSession(s.id);
    list.appendChild(div);
  });
  if (!arr.length) list.innerHTML = '<div class="empty" style="margin-top:20px;font-size:12px">暂无会话</div>';
}

async function newSession() {
  try {
    const j = await api('/api/session', { method: 'POST', body: {} });
    currentSession = j.data.id;
    localStorage.setItem(LS_SESSION, currentSession);
    stopWatch();
    renderMessages([]);
    await loadSessions();
    document.getElementById('input').focus();
  } catch (e) { toast('新建会话失败: ' + e.message, 'error'); }
}

// ---------- 消息 ----------
async function loadMessages() {
  const j = await api('/api/session/' + currentSession + '/message?limit=100');
  return (j.data || []).slice().reverse(); // 升序
}

function renderMessages(msgs) {
  const box = document.getElementById('msgs');
  box.innerHTML = '';
  if (!msgs.length) { box.innerHTML = '<div class="empty">还没有消息，直接输入开始对话</div>'; return; }
  msgs.forEach(m => {
    const div = document.createElement('div');
    if (m.type === 'user') { div.className = 'msg user'; div.textContent = m.text || m.metadata && m.metadata.displayText || ''; }
    else if (m.type === 'assistant') {
      div.className = 'msg assistant';
      const text = (m.content || []).filter(p => p.type === 'text').map(p => p.text).join('\n');
      div.textContent = (text || (m.finish === 'error' ? '⚠️ 模型回复出错（provider 不可用），可到 opencode UI 换模型后重试' : '…'));
      const md = document.createElement('div'); md.className = 'model';
      md.textContent = (m.model && m.model.id || '') + (m.finish ? ' · ' + m.finish : '');
      div.appendChild(md);
    }
    else { div.className = 'msg sys'; div.textContent = '· ' + m.type + ' ·'; return; }
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

async function openSession(id) {
  currentSession = id;
  localStorage.setItem(LS_SESSION, id);
  stopWatch();
  try {
    renderMessages(await loadMessages());
    await loadSessions();
  } catch (e) { toast('加载失败: ' + e.message, 'error'); }
}

async function refreshMessages() {
  if (!currentSession) return;
  try { renderMessages(await loadMessages()); } catch (e) {}
}

// ---------- 发送 + 流式接收 ----------
async function send() {
  const input = document.getElementById('input');
  const text = input.value.trim();
  if (!text) return;
  if (waiting) { toast('正在等待回复…', 'info'); return; }
  if (!currentSession) await newSession();
  if (!currentSession) return;
  input.value = '';
  // 记录发送前的消息 ID 基线（避免把历史里的旧完成消息误判为本次回复）
  let baseline = new Set();
  try { (await loadMessages()).forEach(m => baseline.add(m.id)); } catch (e) {}
  // 本地先显示 user 消息
  const box = document.getElementById('msgs');
  if (box.querySelector('.empty')) box.innerHTML = '';
  const udiv = document.createElement('div'); udiv.className = 'msg user'; udiv.textContent = text;
  box.appendChild(udiv); box.scrollTop = box.scrollHeight;
  try {
    await api('/api/session/' + currentSession + '/prompt', { method: 'POST', body: { text } });
    startWatch(baseline);
  } catch (e) { toast('发送失败: ' + e.message, 'error'); input.value = text; }
}

function startWatch(baseline) {
  waiting = true;
  document.getElementById('sendBtn').disabled = true;
  // SSE 推送即刷新（fetch 流式读取，EventSource 不能带认证头）
  startSSE();
  // 兜底轮询
  let ticks = 0;
  pollTimer = setInterval(async () => {
    ticks++;
    let msgs = [];
    try { msgs = await loadMessages(); } catch (e) { return; }
    renderMessages(msgs);
    // 出现"基线之外、且已 finish"的 assistant 消息即本次回复完成（列表尾部可能有 idle 消息，需向前找 assistant）
    let lastA = null;
    for (let i = msgs.length - 1; i >= 0; i--) { if (msgs[i].type === 'assistant') { lastA = msgs[i]; break; } }
    if (lastA && lastA.finish && !baseline.has(lastA.id)) {
      stopWatch();
      if (lastA.finish === 'error') toast('⚠️ 模型回复出错，可到 opencode UI 切换可用模型', 'error');
      return;
    }
    if (ticks > 400) stopWatch(); // ~10 分钟上限
  }, 1500);
}

function stopWatch() {
  waiting = false;
  document.getElementById('sendBtn').disabled = false;
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
  if (sseAbort) { try { sseAbort.abort(); } catch (e) {} sseAbort = null; }
}

async function startSSE() {
  if (sseAbort) return;
  sseAbort = new AbortController();
  try {
    const r = await fetch(API + '/api/event', { headers: authHeaders(), signal: sseAbort.signal });
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const lines = buf.split('\n');
      buf = lines.pop();
      let got = false;
      for (const line of lines) {
        if (line.startsWith('data:')) {
          try {
            const ev = JSON.parse(line.slice(5));
            const t = ev.type || (ev.data && ev.data.type) || '';
            if (t.includes('message') || t.includes('session')) got = true;
          } catch (e) {}
        }
      }
      if (got) refreshMessages();
    }
  } catch (e) { /* SSE 失败无妨，轮询兜底 */ }
}

// ---------- 工具上下文 ----------
function initCtx() {
  if (!urlTool && !urlCtx) return;
  const bar = document.getElementById('ctxBar');
  bar.style.display = 'flex';
  document.getElementById('ctxText').textContent = (urlTool ? '来自 ' + urlTool : '上下文') + (urlCtx ? ' · ' + urlCtx.length + ' 字符' : '');
}

function insertCtx() {
  if (!urlCtx) return;
  const input = document.getElementById('input');
  input.value = (urlTool ? '【' + urlTool + ' 当前数据】\n' : '【上下文】\n') + urlCtx + '\n\n' + input.value;
  input.focus();
  input.setSelectionRange(input.value.length, input.value.length);
  document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
}

// ---------- 启动 ----------
async function init() {
  if (!token) { setConn(false, '未配对'); showPair(true); return; }
  try {
    await api('/api/session?limit=1'); // 验证凭证
    setConn(true);
  } catch (e) { return; } // api() 内已处理 401 弹配对
  initCtx();
  await loadSessions();
  if (currentSession) { try { renderMessages(await loadMessages()); } catch (e) { currentSession = null; localStorage.removeItem(LS_SESSION); } }
}

document.getElementById('input').addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

init();
</script>
</body>
</html>
