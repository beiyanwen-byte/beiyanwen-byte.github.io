<!DOCTYPE html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Jenkins 环境变量对比工具 🚀</title>
 <style>
 :root {
 --bg-color: #f5f7fa;
 --text-color: #333333;
 --panel-bg: #ffffff;
 --border-color: #ddd;
 --highlight-bg: #fff3cd;
 --highlight-text: #856404;
 --only-a-bg: #f8d7da;
 --only-a-text: #721c24;
 --only-b-bg: #d1ecf1;
 --only-b-text: #0c5460;
 --match-bg: #e9ecef;
 --match-text: #495057;
 --diff-val-bg: #fff3cd;
 --diff-val-text: #856404;
 }
 body {
 font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
 background-color: var(--bg-color);
 color: var(--text-color);
 margin: 0;
 padding: 20px;
 display: flex;
 flex-direction: column;
 height: 100vh;
 box-sizing: border-box;
 }
 .header-nav {
 display: flex;
 align-items: center;
 gap: 20px;
 margin-bottom: 15px;
 }
 .home-btn {
 background: var(--panel-bg);
 color: var(--text-color);
 padding: 8px 16px;
 border-radius: 4px;
 text-decoration: none;
 font-size: 14px;
 border: 1px solid var(--border-color);
 transition: all 0.2s;
 white-space: nowrap;
 }
 .home-btn:hover {
 background: #e9ecef;
 border-color: #007bff;
 }
 h1 {
 text-align: center;
 margin-bottom: 15px;
 font-size: 1.5rem;
 color: #28a745;
 flex: 1;
 }
 .controls {
 display: flex;
 gap: 15px;
 margin-bottom: 15px;
 justify-content: center;
 align-items: center;
 flex-wrap: wrap;
 }
 .separator-select {
 padding: 8px;
 background: var(--panel-bg);
 color: var(--text-color);
 border: 1px solid var(--border-color);
 border-radius: 4px;
 cursor: pointer;
 }
 .input-container {
 display: flex;
 gap: 20px;
 flex: 1;
 min-height: 0;
 margin-bottom: 15px;
 }
 .input-panel {
 flex: 1;
 display: flex;
 flex-direction: column;
 background: var(--panel-bg);
 border-radius: 8px;
 padding: 15px;
 border: 1px solid var(--border-color);
 }
 .input-panel h2 {
 margin-top: 0;
 font-size: 1.1rem;
 border-bottom: 1px solid var(--border-color);
 padding-bottom: 10px;
 margin-bottom: 10px;
 color: #666;
 }
 textarea {
 flex: 1;
 background: var(--bg-color);
 color: var(--text-color);
 border: 1px solid var(--border-color);
 border-radius: 4px;
 padding: 10px;
 font-family: 'Consolas', 'Monaco', monospace;
 font-size: 14px;
 resize: none;
 }
 .result-panel {
 background: var(--panel-bg);
 border-radius: 8px;
 padding: 15px;
 border: 1px solid var(--border-color);
 flex: 1;
 display: flex;
 flex-direction: column;
 }
 .result-panel h2 {
 margin-top: 0;
 font-size: 1.1rem;
 border-bottom: 1px solid var(--border-color);
 padding-bottom: 10px;
 margin-bottom: 10px;
 color: #666;
 }
 .result-content {
 flex: 1;
 overflow: auto;
 background: var(--bg-color);
 border-radius: 4px;
 padding: 10px;
 }
 .result-table {
 width: 100%;
 border-collapse: collapse;
 font-size: 14px;
 }
 .result-table th,
 .result-table td {
 border: 1px solid var(--border-color);
 padding: 8px;
 text-align: left;
 }
 .result-table th {
 background: var(--panel-bg);
 font-weight: 600;
 }
 .only-a {
 background: var(--only-a-bg);
 color: var(--only-a-text);
 }
 .only-b {
 background: var(--only-b-bg);
 color: var(--only-b-text);
 }
 .match {
 background: var(--match-bg);
 color: var(--match-text);
 }
 .diff-val {
 background: var(--diff-val-bg);
 color: var(--diff-val-text);
 font-weight: bold;
 }
 .btn {
 padding: 10px 20px;
 background: #28a745;
 color: #fff;
 border: none;
 border-radius: 4px;
 cursor: pointer;
 font-size: 14px;
 font-weight: 600;
 transition: background 0.2s;
 }
 .btn:hover {
 background: #218838;
 }
 .btn-secondary {
 background: var(--panel-bg);
 color: var(--text-color);
 border: 1px solid var(--border-color);
 }
 .btn-secondary:hover {
 background: #e9ecef;
 }
 .stats {
 margin-top: 10px;
 padding: 10px;
 background: var(--panel-bg);
 border-radius: 4px;
 font-size: 14px;
 }
 .legend {
 display: flex;
 gap: 15px;
 margin-top: 10px;
 flex-wrap: wrap;
 }
 .legend-item {
 display: flex;
 align-items: center;
 gap: 5px;
 font-size: 13px;
 }
 .legend-color {
 width: 16px;
 height: 16px;
 border-radius: 3px;
 }
 </style>
</head>
<body>
 <div class="header-nav">
 <a href="index.html" class="home-btn">← 返回首页</a>
 <h1>🚀 Jenkins 环境变量对比工具</h1>
 </div>
 
 <div class="controls">
 <select id="separator" class="separator-select">
 <option value="=">等号 (=)</option>
 <option value=":">冒号 (:)</option>
 <option value=",">逗号 (,)</option>
 <option value="	">Tab</option>
 <option value=" ">空格</option>
 </select>
 <button id="compareBtn" class="btn">开始对比</button>
 <button id="clearBtn" class="btn btn-secondary">清除</button>
 <button id="copyBtn" class="btn btn-secondary">复制结果</button>
 </div>
 
 <div class="input-container">
 <div class="input-panel">
 <h2>环境变量 A (原始环境)</h2>
 <textarea id="dataA" placeholder="粘贴 Jenkins 环境变量 A...&#10;示例：&#10;PATH=/usr/bin&#10;JAVA_HOME=/opt/java&#10;NODE_ENV=production"></textarea>
 </div>
 <div class="input-panel">
 <h2>环境变量 B (对比环境)</h2>
 <textarea id="dataB" placeholder="粘贴 Jenkins 环境变量 B...&#10;示例：&#10;PATH=/usr/local/bin&#10;JAVA_HOME=/opt/java&#10;NEW_VAR=new_value"></textarea>
 </div>
 </div>
 
 <div class="result-panel">
 <h2>对比结果</h2>
 <div id="resultContent" class="result-content">
 <p style="color: #888; text-align: center;">请先粘贴数据并点击"开始对比"</p>
 </div>
 <div id="stats" class="stats" style="display: none;"></div>
 <div class="legend">
 <div class="legend-item">
 <div class="legend-color" style="background: var(--only-a-bg);"></div>
 <span>A 存在但 B 不存在</span>
 </div>
 <div class="legend-item">
 <div class="legend-color" style="background: var(--only-b-bg);"></div>
 <span>B 存在但 A 不存在</span>
 </div>
 <div class="legend-item">
 <div class="legend-color" style="background: var(--match-bg);"></div>
 <span>两边都有（值相同）</span>
 </div>
 <div class="legend-item">
 <div class="legend-color" style="background: var(--diff-val-bg);"></div>
 <span>两边都有（值不同）</span>
 </div>
 </div>
 </div>
 
 <script>
 // 本地缓存键名
 const STORAGE_KEY_A = 'jenkins_env_data_a';
 const STORAGE_KEY_B = 'jenkins_env_data_b';
 const STORAGE_KEY_SEP = 'jenkins_env_separator';

 // 工具函数：解析环境变量
 function parseEnvData(text, separator) {
 if (!text.trim()) return new Map();
 const lines = text.trim().split('\n');
 const envMap = new Map();
 
 for (let line of lines) {
 line = line.trim();
 if (!line || line.startsWith('#')) continue; // 跳过空行和注释
 
 let key, value;
 if (separator === ' ') {
 // 对于空格分隔，只分割第一个空格
 const idx = line.indexOf(' ');
 if (idx > 0) {
 key = line.substring(0, idx).trim();
 value = line.substring(idx + 1).trim();
 } else {
 key = line;
 value = '';
 }
 } else {
 const idx = line.indexOf(separator);
 if (idx > 0) {
 key = line.substring(0, idx).trim();
 value = line.substring(idx + 1).trim();
 } else {
 key = line;
 value = '';
 }
 }
 
 if (key) {
 envMap.set(key, value);
 }
 }
 
 return envMap;
 }
 
 // 对比环境变量
 function compareEnv(envA, envB) {
 const result = {
 onlyA: [], // A 存在但 B 不存在
 onlyB: [], // B 存在但 A 不存在
 match: [], // 两边都有且值相同
 diffVal: [] // 两边都有但值不同
 };
 
 // 检查 A 中的变量
 envA.forEach((valueA, key) => {
 if (!envB.has(key)) {
 result.onlyA.push({ key, value: valueA, status: 'onlyA' });
 } else {
 const valueB = envB.get(key);
 if (valueA !== valueB) {
 result.diffVal.push({ key, valueA, valueB, status: 'diffVal' });
 } else {
 result.match.push({ key, valueA, valueB, status: 'match' });
 }
 }
 });
 
 // 检查 B 中独有的变量
 envB.forEach((valueB, key) => {
 if (!envA.has(key)) {
 result.onlyB.push({ key, value: valueB, status: 'onlyB' });
 }

 // 排序：每个数组内部按 Key 的字母顺序排序
 result.onlyA.sort((a, b) => a.key.localeCompare(b.key));
 result.onlyB.sort((a, b) => a.key.localeCompare(b.key));
 result.match.sort((a, b) => a.key.localeCompare(b.key));
 result.diffVal.sort((a, b) => a.key.localeCompare(b.key));
 });
 
 return result;
 }
 
 // 渲染结果
 function renderResult(result) {
 const container = document.getElementById('resultContent');
 let html = '<table class="result-table"><thead><tr><th>变量名</th><th>值 A</th><th>值 B</th><th>状态</th></tr></thead><tbody>';
 
 // 渲染 A 独有的
 result.onlyA.forEach(item => {
 html += `<tr class="only-a">
 <td><strong>${item.key}</strong></td>
 <td>${item.value}</td>
 <td>-</td>
 <td>A 存在但 B 不存在</td>
 </tr>`;
 });
 
 // 渲染 B 独有的
 result.onlyB.forEach(item => {
 html += `<tr class="only-b">
 <td><strong>${item.key}</strong></td>
 <td>-</td>
 <td>${item.value}</td>
 <td>B 存在但 A 不存在</td>
 </tr>`;
 });
 
 // 渲染两边都有且值相同
 result.match.forEach(item => {
 html += `<tr class="match">
 <td><strong>${item.key}</strong></td>
 <td>${item.valueA}</td>
 <td>${item.valueB}</td>
 <td>两边都有（相同）</td>
 </tr>`;
 });
 
 // 渲染两边都有但值不同
 result.diffVal.forEach(item => {
 html += `<tr class="diff-val">
 <td><strong>${item.key}</strong></td>
 <td>${item.valueA}</td>
 <td>${item.valueB}</td>
 <td>值不同</td>
 </tr>`;
 });
 
 html += '</tbody></table>';
 container.innerHTML = html;
 
 // 更新统计
 const stats = document.getElementById('stats');
 stats.innerHTML = `
 A 独有：${result.onlyA.length} | B 独有：${result.onlyB.length} | 两边都有（相同）：${result.match.length} | 值不同：${result.diffVal.length}
 `;
 stats.style.display = 'block';
 }
 
 // 事件监听
 document.getElementById('compareBtn').addEventListener('click', () => {
 const separator = document.getElementById('separator').value;
 const envA = parseEnvData(document.getElementById('dataA').value, separator);
 const envB = parseEnvData(document.getElementById('dataB').value, separator);
 
 if (envA.size === 0 && envB.size === 0) {
 alert('请粘贴有效的环境变量数据');
 return;
 }
 
 const result = compareEnv(envA, envB);
 renderResult(result);
 });

 // 自动保存和恢复缓存
 const dataAEl = document.getElementById('dataA');
 const dataBEl = document.getElementById('dataB');
 const separatorEl = document.getElementById('separator');

 // 页面加载时恢复缓存
 window.addEventListener('DOMContentLoaded', () => {
 const savedA = localStorage.getItem(STORAGE_KEY_A);
 const savedB = localStorage.getItem(STORAGE_KEY_B);
 const savedSep = localStorage.getItem(STORAGE_KEY_SEP);

 if (savedA) dataAEl.value = savedA;
 if (savedB) dataBEl.value = savedB;
 if (savedSep) separatorEl.value = savedSep;
 });

 // 输入时自动保存
 dataAEl.addEventListener('input', () => {
 localStorage.setItem(STORAGE_KEY_A, dataAEl.value);
 });

 dataBEl.addEventListener('input', () => {
 localStorage.setItem(STORAGE_KEY_B, dataBEl.value);
 });

 separatorEl.addEventListener('change', () => {
 localStorage.setItem(STORAGE_KEY_SEP, separatorEl.value);
 });
 
 document.getElementById('clearBtn').addEventListener('click', () => {
 dataAEl.value = '';
 dataBEl.value = '';
 localStorage.removeItem(STORAGE_KEY_A);
 localStorage.removeItem(STORAGE_KEY_B);
 document.getElementById('resultContent').innerHTML = '<p style="color: #888; text-align: center;">请先粘贴数据并点击"开始对比"</p>';
 document.getElementById('stats').style.display = 'none';
 });
 
 document.getElementById('copyBtn').addEventListener('click', () => {
 const table = document.querySelector('.result-table');
 if (!table) {
 alert('没有可复制的结果');
 return;
 }
 
 const range = document.createRange();
 range.selectNode(table);
 window.getSelection().removeAllRanges();
 window.getSelection().addRange(range);
 document.execCommand('copy');
 window.getSelection().removeAllRanges();
 
 alert('结果已复制到剪贴板');
 });
 </script>
</body>
</html>
